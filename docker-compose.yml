services:
  timp:
    build: .
    restart: unless-stopped
    environment:
      TZ: Europe/Rome
      UPDATE_INTERVAL: "300"
      UPDATE_BRANCH: master
      GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=accept-new
    volumes:
      - ./.env:/app/.env
      - ~/.ssh/timp_deploy_docker:/root/.ssh/id_ed25519:ro
    healthcheck:
      test: ["CMD", "pgrep", "supercronic"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
